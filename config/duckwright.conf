# Global defaults for every run, read from ./config/duckwright.conf at startup.
# Order: built-in defaults < this file < a task file's front matter < command-line flags.
# Same keys as a task file's front matter, plus the TUI and web options at the end.
# Relative paths (skill, state) are resolved from this folder.
# allow-file-access is not allowed here; pass it on the command line.

# model: sonnet
# max-steps: 25
# headed: false
# skill: ../prompts/playwright-cli.md
# session: duckwright
# state: auth.json
# network: true
# twofa-timeout: 300
# snapshot: hybrid

# max-parallel: 3
# past: 20
# theme: auto
