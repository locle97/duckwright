<!doctype html>
<html>
<head><meta charset="utf-8"><title>Settings</title></head>
<body>
  <label><input id="email" type="checkbox"> Email notifications</label>
  <label><input id="digest" type="checkbox"> Weekly digest</label>
  <label><input id="sms" type="checkbox"> SMS alerts</label>
  <button id="save" type="button">Save</button>
  <p id="status"></p>
  <script>
    document.getElementById("save").addEventListener("click", function () {
      var on = ["email", "digest", "sms"].filter(function (k) {
        return document.getElementById(k).checked;
      });
      document.getElementById("status").textContent =
        "Saved: " + (on.length ? on.join(", ") : "nothing");
    });
  </script>
</body>
</html>
