[project]
name = "duckwright"
version = "0.1.0"
description = "Duckwright: a browser agent loop on playwright-cli + claude -p"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/locle97/duckwright"
Issues = "https://github.com/locle97/duckwright/issues"

[project.scripts]
duckwright = "duckwright.__main__:main"

[project.optional-dependencies]
dev = ["pytest", "jsonschema", "build"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["duckwright", "duckwright.prompts"]

[tool.setuptools.package-data]
"duckwright.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
