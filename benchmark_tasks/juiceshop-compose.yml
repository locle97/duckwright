# For benchmark_tasks/08-juiceshop-idor-basket.md.
# Start:  docker compose -f benchmark_tasks/juiceshop-compose.yml up -d
# Stop:   docker compose -f benchmark_tasks/juiceshop-compose.yml down
# Wait for http://localhost:3000/ to answer before running the task; a fresh container takes a
# few seconds to seed its database.
#
# `latest` moves. If a run's numbers stop matching the task's expected answer, pin a tag instead,
# e.g. bkimminich/juice-shop:v18.0.0 (see https://hub.docker.com/r/bkimminich/juice-shop/tags).
services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    ports:
      - "3000:3000"
    restart: unless-stopped
